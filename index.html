<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover：PWA 独立窗口铺满含底部安全区（Home 条），避免底栏下方露白 -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>蛋蛋字幕翻译</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- 与壳色一致，安装/启动/安全区空隙不露白 -->
  <meta name="theme-color" content="#f0f1f4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f0f1f4" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="蛋蛋字幕翻译" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/icons/192.png" />
  <!-- 仅 manifest（主题色/名称/图标）；不注册 Service Worker -->
  <link rel="manifest" href="/manifest.webmanifest" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
